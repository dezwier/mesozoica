# Railway field-ensure worker service.
# In Railway dashboard: add a worker service with config file path backend/railway.worker.toml
#
# Mount the same /data volume as the API service and set FIELD_COORDINATE_DATA_DIR=/data.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "./docker-entrypoint.sh env MESOZOICA_MINIMAL_SETTINGS=1 python -m app.workers.field_ensure_worker"
restartPolicyType = "ON_FAILURE"
