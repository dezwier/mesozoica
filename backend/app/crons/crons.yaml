# Central cron job registry (UTC schedules). Loaded by `python -m app.crons.runner`.
#
# Railway cron service cronSchedule must fire at least as often as the finest
# job granularity below. Use "0 * * * *" on the platform for weekly jobs.

jobs:
  - id: dinosaur_wiki_sync
    enabled: false
    schedule: "0 3 * * 0"
    params:
      dry_run: false
      overwrite: false
      max_pages: null

  - id: dinosaur_llm_enrich
    enabled: false
    schedule: "0 4 * * 0"
    params:
      dry_run: false
      overwrite: false
      max_records: null

  - id: fossil_pbdb_sync
    enabled: false
    schedule: "0 5 * * 0"
    params:
      dry_run: false
      overwrite: false
      stale_days: 7

  - id: fossil_llm_enrich
    enabled: false
    schedule: "0 6 * * 0"
    params:
      dry_run: false
      overwrite: false
      max_records: null

  - id: dinosaur_image_generate
    enabled: false
    schedule: "0 6 * * 0"
    params:
      dry_run: false
      max_items: null

  - id: fossil_image_generate
    enabled: false
    schedule: "0 7 * * 0"
    params:
      dry_run: false
      max_items: null

  - id: site_type_image_generate
    enabled: false
    schedule: "0 8 * * 0"
    params:
      dry_run: false
      max_items: null

  - id: site_sync
    enabled: false
    schedule: "0 9 * * 0"
    params:
      dry_run: false

  - id: site_type_sync
    enabled: false
    schedule: "30 9 * * 0"
    params:
      dry_run: false

  - id: tool_sync
    enabled: false
    schedule: "0 10 * * 0"
    params:
      dry_run: false
      prune: false

  - id: tool_image_generate
    enabled: false
    schedule: "30 10 * * 0"
    params:
      dry_run: false
      max_items: null

  - id: field_site_coordinate_prune
    enabled: false
    schedule: "0 11 * * 0"
    params:
      dry_run: false

  # Manual only. The database is the source of truth once seeded; force
  # republishes the repo YAML and overwrites admin edits.
  - id: game_config_seed
    enabled: false
    schedule: "0 12 * * 0"
    params:
      dry_run: false
      force: false
      prune: false
