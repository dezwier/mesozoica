# Central cron job registry (UTC schedules). Loaded by `python -m app.crons.runner`.
#
# Railway cron service cronSchedule must fire at least as often as the finest
# job granularity below. Use "0 * * * *" on the platform for weekly jobs.

jobs:
  - id: dinosaur_wiki_sync
    enabled: false
    schedule: "0 3 * * 0"
    params:
      dry_run: false
      overwrite: false
      max_pages: null

  - id: dinosaur_llm_enrich
    enabled: false
    schedule: "0 4 * * 0"
    params:
      dry_run: false
      overwrite: false
      max_records: null

  - id: fossil_pbdb_sync
    enabled: false
    schedule: "0 5 * * 0"
    params:
      dry_run: false
      overwrite: false
      stale_days: 7

  - id: fossil_llm_enrich
    enabled: false
    schedule: "0 6 * * 0"
    params:
      dry_run: false
      overwrite: false
      max_records: null

  - id: dinosaur_image_generate
    enabled: false
    schedule: "0 6 * * 0"
    params:
      dry_run: false
      max_items: null

  - id: fossil_image_generate
    enabled: false
    schedule: "0 7 * * 0"
    params:
      dry_run: false
      max_items: null

  - id: site_type_image_generate
    enabled: false
    schedule: "0 8 * * 0"
    params:
      dry_run: false
      max_items: null

  - id: site_sync
    enabled: false
    schedule: "0 9 * * 0"
    params:
      dry_run: false

  - id: site_type_sync
    enabled: false
    schedule: "30 9 * * 0"
    params:
      dry_run: false

  - id: field_site_generate
    enabled: false
    schedule: "0 10 * * 0"
    params:
      dry_run: false
      refresh: false
      max_items: 100
      nearby_radius_km: 100.0
      closest_neighbor_count: 20
      weight_global: 0.25
      weight_nearby: 0.50
      weight_closest: 0.25
      max_coordinate_attempts: 200
      min_separation_km: 1.0
      exclude_military: false

  - id: tool_sync
    enabled: false
    schedule: "0 10 * * 0"
    params:
      dry_run: false
      prune: false

  - id: tool_image_generate
    enabled: false
    schedule: "30 10 * * 0"
    params:
      dry_run: false
      max_items: null
