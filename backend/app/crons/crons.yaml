# Central cron job registry (UTC schedules). Loaded by `python -m app.crons.runner`.
#
# Railway cron service cronSchedule must fire at least as often as the finest
# job granularity below. Use "0 * * * *" on the platform for weekly jobs.

jobs:
  - id: wikipedia_dinosaur_sync
    enabled: false
    schedule: "0 3 * * 0"
    params:
      dry_run: false
      overwrite: false
      max_pages: null

  - id: dinosaur_llm_enrich
    enabled: false
    schedule: "0 4 * * 0"
    params:
      dry_run: false
      overwrite: false
      max_records: null

  - id: pbdb_fossil_sync
    enabled: false
    schedule: "0 5 * * 0"
    params:
      dry_run: false
      overwrite: false
      stale_days: 7

  - id: dinosaur_image_generate
    enabled: false
    schedule: "0 6 * * 0"
    params:
      dry_run: false
      max_items: null

  - id: fossil_image_generate
    enabled: false
    schedule: "0 7 * * 0"
    params:
      dry_run: false
      max_items: null
