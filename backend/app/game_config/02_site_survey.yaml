  fossil_count: []
  depth_weights: []
  completeness_weights: []
  quality_weights: []

# Per-sampler ±noise applied to each odd_* score before tier lookup.
odd_noise:
  dino_count: 0
  fossil_count: 0.5
  completeness: 0.3
  quality: 0.3
  depth: 0.3

# Fallback attributes when distributions are empty.
defaults:
  subcategory: teeth
  completeness: fragmentary
  quality: moderate
