# Skill 2 — Site Survey
# Field fossils spawned when a site is surveyed (once per site, global).
#
# Each field site has five odd_* scores Uniform(0,1). On survey, attributes use
# score = clamp(odd + Uniform(-noise, +noise), 0, 1) then pick a tier.
# See README.md in this directory for the full mechanics.

skill_id: site_survey

main_params:
  # Card display precision for each odd_* axis (0 = full-axis blur/jitter, 1 = exact).
  # Display-only for now; survey sampling still uses odd_noise below.
  dino_accuracy: 0
  fossil_accuracy: 0
  completeness_accuracy: 0
  quality_accuracy: 0
  depth_accuracy: 0

  # How many distinct dinosaurs to sample for the site (from clamp(odd_dino_count)).
  dino_count:
    - max_odd: 0.10
      count: 0
    - max_odd: 0.60
      count: 1
    - max_odd: 0.80
      count: 2
    - max_odd: 0.90
      count: 3
    - max_odd: 0.95
      count: 4
    - max_odd: 1.00
      count: 5

  # How many fossil cards per sampled dinosaur (CDF masses; inverse-CDF via odd_fossil_count).
  fossil_count:
    1: 0.25
    2: 0.25
    3: 0.20
    4: 0.15
    5: 0.10
    6: 0.05

  # Burial depth buckets (weights = CDF masses via odd_depth). Sample uniform in [min_cm, max_cm].
  depth_weights:
    - weight: 0.10
      min_cm: 0
      max_cm: 0
    - weight: 0.30
      min_cm: 1
      max_cm: 50
    - weight: 0.30
      min_cm: 51
      max_cm: 200
    - weight: 0.20
      min_cm: 201
      max_cm: 500
    - weight: 0.10
      min_cm: 501
      max_cm: 1000

  # Completeness tiers worst→best (CDF masses via odd_completeness). Replaces archive CDFs.
  completeness_weights:
    trace_only: 0.05
    isolated_element: 0.20
    fragmentary: 0.30
    partial: 0.25
    substantial: 0.15
    nearly_complete: 0.05

  # Preservation quality tiers worst→best (CDF masses via odd_quality). Replaces archive CDFs.
  quality_weights:
    very_poor: 0.05
    poor: 0.15
    moderate: 0.35
    good: 0.25
    excellent: 0.15
    exceptional: 0.05

# Accuracy: +0.01 per level (1..99). Distribution tables: identity for v1.
level_modifiers:
  # +1% per site_survey level (highest matching entry; base 0 + level + tools).
  dino_accuracy: &site_survey_accuracy_levels
