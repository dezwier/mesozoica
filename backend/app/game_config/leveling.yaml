# Career / skill leveling (RuneScape-style XP).
#
# XP thresholds for levels 1–99 are NOT listed here — they are generated once
# in code from the classic formula and cached (binary search for level_for_xp).
# Career thresholds = skill thresholds × 3 (career XP = sum of three skills).
#
# Title lists are indexed by skill level 1..99 (list position 0 = level 1).
# Career title = "{exploration[L]} {excavation[L]} {research[L]}" using
# each skill's own level.

