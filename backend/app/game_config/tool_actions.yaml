# Per-tool action parameters (gameplay knobs, not catalog copy).
# duration_minutes is the lifetime battery on each owned tool card.
# Starting an action uses all remaining time; HUD stop charges only elapsed.
#
# modifies_main_params: optional impact on one or more skills' main_params.
#   owning: while the player owns a card (passive)
#   using:  while a tool session is active (in use)
#   Each bucket maps skill_id → { param_name: { op, value } }
#   Ops:
#     replace  — set absolute value (e.g. discovery_chance → 0.9)
#     multiply — scale base (e.g. 1.1 = +10%)
#     add      — offset base (e.g. visibility_distance_m + 50)
# Example:
#   owning:
#     site_discovery:
#       visibility_distance_m: { op: add, value: 50 }        # +50 m
#       discovery_chance: { op: multiply, value: 1.1 }       # +10%
#     site_survey:
#       fossil_count: { op: multiply, value: 1.1 }
#   using:
#     site_discovery:
#       discovery_chance: { op: replace, value: 0.9 }        # set to 90%
# Guidance tools (compass / navigator) use `using` / site_discovery today.

aerial_recon:
  # Lifetime battery; max route km = flight_speed_kmh × remaining_minutes / 60.
  # Actual flight time after deploy = drawn_route_km / flight_speed_kmh.
  duration_minutes: 60
  # start/end must be within this of the player's GPS origin
  loop_endpoint_tolerance_m: 75
  flight_speed_kmh: 50
  flight_discovery_chance: 0.01
  flight_discovery_distance_m: 200
  # promote ensuring → flying even if some ensure jobs are still pending
  ensure_timeout_s: 600
  # warn on confirm when drawn length is below this fraction of max route
  short_route_warn_fraction: 0.7
  # One-line blurb shown on the tool card stats panel
  stats_explanation: >-
    Duration is this card's lifetime battery. Remaining time caps how far
    you can draw (speed × remaining). Flight time is drawn length ÷ speed.
    Sites within flight discovery distance are rolled at the listed chance.

aerial_scout:
  duration_minutes: 10
  loop_endpoint_tolerance_m: 75
  flight_speed_kmh: 35
  flight_discovery_chance: 0.008
  flight_discovery_distance_m: 50
  ensure_timeout_s: 600
  short_route_warn_fraction: 0.7
  stats_explanation: >-
    Duration is this card's lifetime battery. Remaining time caps how far
    you can draw (speed × remaining). Flight time is drawn length ÷ speed.
    Sites within flight discovery distance are rolled at the listed chance.

geo_compass:
  exactness: 0.0
  duration_minutes: 15
  direction_hint_period_s: 3
  max_direction_range_deg: 180
  min_direction_range_deg: 4
  modifies_main_params:
    using:
      site_discovery:
        discovery_chance: { op: replace, value: 0.9 }
  stats_explanation: >-
    Duration is this card's lifetime battery; each use runs until you stop
    or time runs out. Shows a direction range toward the nearest undiscovered
    site; lower exactness widens the glow. Walk-in discovery of that nearest
    site uses the listed chance instead of the base rate.

proximity_scanner:
  exactness: 0.0
  duration_minutes: 15
  stats_explanation: >-
    Duration is this card's lifetime battery; each use runs until you stop
    or time runs out. Shows distance to the nearest undiscovered site as
    meter bands; lower exactness uses coarser rounding (up to 200 m), higher
    is finer (down to 1 m).

site_navigator:
  direction_exactness: 0.0
  distance_exactness: 0.0
  duration_minutes: 15
  direction_hint_period_s: 3
  max_direction_range_deg: 180
  min_direction_range_deg: 4
  modifies_main_params:
    using:
      site_discovery:
        discovery_chance: { op: replace, value: 0.9 }
  stats_explanation: >-
    Duration is this card's lifetime battery; each use runs until you stop
    or time runs out. Combines a direction-range glow and distance bands for
    the nearest undiscovered site, with the listed walk-in discovery chance
    for that site.

orbit_survey:
  duration_minutes: 10
  accuracy: 0.75
  range: 0.35
  min_range_m: 200
  max_range_m: 2000
  # Overlay look (client raster)
  base_alpha: 0.48
  # Outer fraction of the circle that fades to transparent (0=hard edge, 1=fade from center)
  range_fade: 0.85
  # Softness of period color borders (0=sharp, 1=very soft); accuracy still sharpens further
  boundary_blur: 1
  stats_explanation: >-
    Duration is this card's lifetime battery; each use runs until you stop
    or time runs out. Colors the map by the period of nearby undiscovered
    field sites. Higher accuracy sharpens boundaries; higher range widens
    the circle (200 m–2 km).

formation_map:
  duration_minutes: 10
  accuracy: 0.75
  # Uses the same fixed 500 m grid as site_generation.lazy.cell_size_m
  wideness_m: 500
  min_wideness_m: 500
  max_wideness_m: 2000
  cell_size_m: 500
  base_alpha: 0.48
  # Outer rectangle edge uses a fixed soft fade in the client raster (not this knob).
  range_fade: 0
  boundary_blur: 1
  stats_explanation: >-
    Duration is this card's lifetime battery; each use runs until you stop
    or time runs out. Colors a fixed square of the map by rock type. Higher
    accuracy sharpens rock-type boundaries; the outer edge has a slight fixed
    soft fade. Wideness sets the side length (500 m–2 km) on the same 500 m
    grid used for field sites, locked to this tool occurrence.

terrain_echo:
  accuracy: 0.0
  range_m: 20
  min_range_m: 20
  max_range_m: 200
  duration_minutes: 5
  min_duration_minutes: 5
  max_duration_minutes: 20
  ring_increment_m: 20
  sweep_period_s: 4
  stats_explanation: >-
    Duration is this card's lifetime battery (editable within min/max); each
    use runs on whatever time remains until you stop or it runs out. Rotating
    survey pulse around your position. Blips mark nearby sites you have not
    discovered yet. Higher accuracy tightens blips; range sets pulse radius
    (20–200 m).

ridge_glass:
  duration_minutes: 60
  modifies_main_params:
    using:
      site_discovery:
        visibility_distance_m: { op: multiply, value: 1.3 }
        discovery_chance: { op: multiply, value: 1.3 }
        max_discovery_speed_kmh: { op: multiply, value: 0.7 }
  stats_explanation: >-
    Duration is this card's lifetime battery; each use runs until you stop
    or time runs out. While active, boosts site visibility range and
    walk-in discovery chance, and decreases max discovery speed for all sites.
