# Per-tool action parameters (gameplay knobs, not catalog copy).

aerial_recon:
  max_route_km: 50
  # start/end must be within this of the player's GPS origin
  loop_endpoint_tolerance_m: 75
  # Flight time = route_length_km / flight_speed_kmh (snapshotted as flight_duration_s)
  flight_speed_kmh: 50
  discovery_chance: 0.01
  discovery_distance_m: 200
  ensure_sample_spacing_km: 0.5
  # promote ensuring → flying even if some ensure jobs are still pending
  ensure_timeout_s: 600
  # warn on confirm when drawn length is below this fraction of max_route_km
  short_route_warn_fraction: 0.7
  # One-line blurb shown on the tool card stats panel
  stats_explanation: >-
    Scout loops fly at this speed within the max range; sites within
    discovery distance are rolled at the listed chance.

aerial_scout:
  max_route_km: 5
  loop_endpoint_tolerance_m: 75
  flight_speed_kmh: 35
  discovery_chance: 0.008
  discovery_distance_m: 50
  ensure_sample_spacing_km: 0.5
  ensure_timeout_s: 600
  short_route_warn_fraction: 0.7
  stats_explanation: >-
    Drone loops fly at this speed within the max range; sites within
    discovery distance are rolled at the listed chance.

geo_compass:
  exactness: 0.0
  discovery_chance: 0.9
  duration_minutes: 15
  needle_jitter_period_s: 3
  max_jitter_deg: 90
  stats_explanation: >-
    Points toward the nearest undiscovered site for this duration; lower
    exactness adds needle drift. Walk-in discovery of that nearest site uses
    the listed chance instead of the base rate.

proximity_scanner:
  exactness: 0.0
  duration_minutes: 15
  band_edges_m: [250, 500, 750, 1000]
  mid_round_m: 100
  stats_explanation: >-
    Shows how far you are from the nearest undiscovered site. Low exactness
    uses coarse bands; mid rounds to 100 m; high shows precise distance.

site_navigator:
  direction_exactness: 0.0
  distance_exactness: 0.0
  discovery_chance: 0.9
  duration_minutes: 15
  needle_jitter_period_s: 3
  max_jitter_deg: 90
  band_edges_m: [250, 500, 750, 1000]
  mid_round_m: 100
  stats_explanation: >-
    Combines compass direction and proximity readout for the nearest
    undiscovered site, with the listed walk-in discovery chance for that site.
