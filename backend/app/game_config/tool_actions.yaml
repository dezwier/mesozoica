# Per-tool action parameters (gameplay knobs, not catalog copy).

aerial_recon:
  max_route_km: 100
  # start/end must be within this of the player's GPS origin
  loop_endpoint_tolerance_m: 75
  # Flight time = route_length_km / flight_speed_kmh (snapshotted as flight_duration_s)
  flight_speed_kmh: 50
  discovery_chance: 0.01
  discovery_distance_m: 200
  ensure_sample_spacing_km: 0.5
  # promote ensuring → flying even if some ensure jobs are still pending
  ensure_timeout_s: 600
  # warn on confirm when drawn length is below this fraction of max_route_km
  short_route_warn_fraction: 0.7
  # One-line blurb shown on the tool card stats panel
  stats_explanation: >-
    Scout loops fly at this speed within the max range; sites within
    discovery distance are rolled at the listed chance.
