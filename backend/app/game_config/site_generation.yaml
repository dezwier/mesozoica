# Field site generation around the player (lazy ensure) and bulk cron generate.
#
# Lazy density is server-enforced only: never more than max_sites_per_cell
# inside a cell_size_m axis-aligned square. Client radius_km is ignored.

lazy:
  max_sites_per_cell: 50
  cell_size_m: 500
  min_separation_km: 0.030
  # Archive geology blend window around each new site (not density geometry)
  nearby_radius_km: 2000.0
  closest_neighbor_count: 10
  weight_global: 0.1
  weight_nearby: 0.45
  weight_closest: 0.45
  max_coordinate_attempts: 200

bulk:
  max_items: 200
  min_separation_km: 0.030
  nearby_radius_km: 1000.0
  closest_neighbor_count: 10
  weight_global: 0.1
  weight_nearby: 0.45
  weight_closest: 0.45
  max_coordinate_attempts: 200

# Flutter session triggers for POST /sites/field/ensure.
# Walk ensure fires when the player enters a new lazy.cell_size_m square.
# nearby_radius_km is a client hint only; server ignores it for density.
client:
  nearby_radius_km: 0.5
