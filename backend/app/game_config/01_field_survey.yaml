    dawn: [{ op: multiply, value: 1.2 }]
    dusk: [{ op: multiply, value: 1.2 }]
    night: [{ op: multiply, value: 1.5 }]

# Ambient weather type (clear|cloudy|…). After weather_time, before tools.
weather_type_modifiers:
  visibility_distance_m: &field_survey_weather_type
    clear: [{ op: multiply, value: 1.1 }]
    cloudy: [{ op: multiply, value: 1.05 }]
    overcast: []
    drizzle: [{ op: multiply, value: 0.95 }]
    rain: [{ op: multiply, value: 0.9 }]
    hail: [{ op: multiply, value: 0.9 }]
    fog: [{ op: multiply, value: 0.85 }]
    thunderstorm: [{ op: multiply, value: 0.8 }]
    snow: []
  discovery_chance: *field_survey_weather_type
  max_discovery_speed_kmh: {}
  site_discovery_xp: {}
  first_discovery_xp: {}
  active_100m_xp: {}
  passive_km_xp: {}

# Flutter auto-discover + nearby-discoverable cache.
client:
  auto_discover_radius_m: 20.0
  cache_radius_km: 1.0
  cache_refresh_move_threshold_m: 500.0
  discover_fail_retry_s: 20
  # Re-roll while staying inside auto_discover_radius_m (not a main_param).
  # Walk-in still rolls immediately; app-open already inside does not (timer starts).
  discovery_reroll_interval_s: 10

# Fixed global distribution tables (not subject to level/tool multipliers).
dino_count:
  - max_odd: 0.10
    count: 0
  - max_odd: 0.60
    count: 1
  - max_odd: 0.80
    count: 2
  - max_odd: 0.90
    count: 3
  - max_odd: 0.95
    count: 4
  - max_odd: 1.00
    count: 5

# How many fossil cards per sampled dinosaur (CDF masses; inverse-CDF via odd_fossil_count).
fossil_count:
  1: 0.25
  2: 0.25
  3: 0.20
  4: 0.15
  5: 0.10
  6: 0.05

# Burial depth buckets (weights = CDF masses via odd_depth). Sample uniform in [min_cm, max_cm].
depth_weights:
  - weight: 0.10
    min_cm: 0
    max_cm: 0
  - weight: 0.30
    min_cm: 1
    max_cm: 50
  - weight: 0.30
    min_cm: 51
    max_cm: 200
  - weight: 0.20
    min_cm: 201
    max_cm: 500
  - weight: 0.10
    min_cm: 501
    max_cm: 1000

# Completeness tiers worst→best (CDF masses via odd_completeness). Replaces archive CDFs.
completeness_weights:
  trace_only: 0.05
  isolated_element: 0.20
  fragmentary: 0.30
  partial: 0.25
  substantial: 0.15
  nearly_complete: 0.05

# Preservation quality tiers worst→best (CDF masses via odd_quality). Replaces archive CDFs.
quality_weights:
  very_poor: 0.05
  poor: 0.15
  moderate: 0.35
  good: 0.25
  excellent: 0.15
  exceptional: 0.05

# Accuracy: +0.01 per level (1..99).
odd_noise:
  dino_count: 0
  fossil_count: 0.5
  completeness: 0.3
  quality: 0.3
  depth: 0.3

# Per-axis jitter around skill baseline accuracy on the site card (not a main_param;
# not level/tool resolvable). max_delta = ± absolute accuracy points (e.g. 0.30 → ±30%).
accuracy_noise:
  max_delta: 0.30

# Fallback attributes when distributions are empty.
defaults:
  subcategory: teeth
  completeness: fragmentary
  quality: moderate
