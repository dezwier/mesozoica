# Skill 1 — Field Survey
# Site discovery, stewardship, and clearing (merged).

skill_id: field_survey

main_params:
  # --- discovery ---
  # Server enforces this on POST /sites/{id}/discover (and set-status).
  discovery_distance_m: 20.0
  # P(success) per discover attempt (walk-in enter or dwell re-roll).
  discovery_chance: 0.1
  # Max GPS speed for walk XP credit and walk-in / dwell discovery rolls.
  discovery_max_speed_kmh: 10.0
  # XP awarded when a site is discovered.
  discover_site_xp: 20
  # Bonus XP when you are the first user to discover a site (others still get
  # discover_site_xp later, but not this reward).
  discover_site_as_first_xp: 20
  # XP per whole 100 m of active walking.
  explore_100m_actively_xp: 20
  # Passive rate: XP per 100 m (pro-rata per 10 m; e.g. 10 → 1 XP / 10 m).
  # Credited on cold start / resume: weekly = max(activeWeekly, Health Monday→now)
  # so passive ≈ Health − active. Health uses statistics (not raw sample sums).
  # Gaps under 10 m grant nothing. Max lookback 7 days.
  explore_100m_passively_xp: 10
  # --- stewardship ---
  # Card display estimation baseline for all odd_* axes (0 = full-axis blur,
  # 1 = exact). Base 1%; level multiplies (L50 → 50%). Per-axis noise stays
  # separate via accuracy_noise.
  documentation_accuracy: 0.01
  # Multiplier on discovery_chance for other users on sites where you have any
  # status above hidden (discovered, documented, excavated, …).
  # Level multiplies ×1.0 → ×0.5 from L1 → L99; tools multiply further on a covered site.
  rival_discovery_chance: 1
  # Radius around a discovered site where walking accrues exploration meters.
  documentation_distance_m: 50.0
  # XP when a rival discovery roll would have hit but your disguise blocked it
  # (Brush Scrim / Blackout Cover). Scrim still rolls; effective odds are 0.
  disguise_of_site_xp: 40
  # XP to field_survey per 20 m walked inside documentation_distance_m.
  document_progress_xp: 20
  # XP when all five site-dimension accuracies reach 100% (documentation complete).
  document_site_xp: 80
  # Bonus XP when you are the first user to fully document a site (all dimensions
  # at 100% accuracy). Later documenters still get document_site_xp only.
  document_site_as_first_xp: 20
  # XP per identification quiz step (period, then rock type). Scaled by attempt:
  # first try 100%, second 50%, third 0%. Exploration meters start after both.
  identify_site_xp: 40

# Keyframes: { level, op: add|multiply|replace, value }. Values lerp linearly
# between adjacent entries (endpoints alone are enough for a straight ramp).
level_modifiers:
  # Reach / chance: ×1.0 at L1 → ×1.5 at L99.
  discovery_distance_m: &field_survey_reach_levels
    - { level: 1, op: multiply, value: 1 }
    - { level: 99, op: multiply, value: 1.5 }
  discovery_chance: *field_survey_reach_levels
  documentation_distance_m: *field_survey_reach_levels
  discovery_max_speed_kmh: []
  rival_discovery_chance:
    - { level: 1, op: multiply, value: 1 }
    - { level: 99, op: multiply, value: 0.5 }

  # Estimation: base 0.01 × skill level (L1 → 1%, L50 → 50%, L99 → 99%).
  documentation_accuracy:
    - { level: 1, op: multiply, value: 1 }
    - { level: 99, op: multiply, value: 99 }

  # XP multipliers
  explore_100m_actively_xp: []
  explore_100m_passively_xp: []
  discover_site_xp: []
  discover_site_as_first_xp: []
  disguise_of_site_xp: []
  document_progress_xp: []
  document_site_xp: []
  document_site_as_first_xp: []
  # Rival discovery: ×1.0 at L1 → ×0.5 at L99 (all sites above hidden).

# Ambient solar period (dawn|day|dusk|golden_hour|night). After level, before weather_type + tools.
weather_time_modifiers:
  discovery_distance_m: &field_survey_weather_time
    day: [{ op: multiply, value: 1.1 }]
    golden_hour: [{ op: multiply, value: 1.3 }]
    dawn: []
    dusk: []
    night: [{ op: multiply, value: 0.6 }]
  discovery_chance: *field_survey_weather_time
  discovery_max_speed_kmh: {}
  documentation_distance_m: *field_survey_weather_time

  # XP: day +0%, golden_hour +30%, dawn/dusk +10%, night +20%.  
  explore_100m_actively_xp: &field_survey_weather_time_xp
    day: []
    golden_hour: [{ op: multiply, value: 1.3 }]
    dawn: [{ op: multiply, value: 1.1 }]
    dusk: [{ op: multiply, value: 1.1 }]
    night: [{ op: multiply, value: 1.2 }]
  explore_100m_passively_xp: {}
  discover_site_xp: *field_survey_weather_time_xp
  discover_site_as_first_xp: {}
  document_progress_xp: *field_survey_weather_time_xp
  document_site_xp: *field_survey_weather_time_xp

# Ambient weather type (clear|cloudy|…). After weather_time, before tools.
weather_type_modifiers:
  discovery_distance_m: &field_survey_weather_type
    clear: [{ op: multiply, value: 1.1 }]
    cloudy: [{ op: multiply, value: 1.05 }]
    overcast: []
    drizzle: [{ op: multiply, value: 0.95 }]
    rain: [{ op: multiply, value: 0.9 }]
    hail: [{ op: multiply, value: 0.9 }]
    fog: [{ op: multiply, value: 0.85 }]
    thunderstorm: [{ op: multiply, value: 0.8 }]
    snow: [{ op: multiply, value: 0.85 }]
  discovery_chance: *field_survey_weather_type
  discovery_max_speed_kmh: {}
  documentation_distance_m: *field_survey_weather_type

  # XP multipliers
  explore_100m_actively_xp: &field_survey_weather_type_xp
    clear: []
    cloudy: []
    overcast: []
    drizzle: [{ op: multiply, value: 1.1 }]
    rain: [{ op: multiply, value: 1.2 }]
    hail: [{ op: multiply, value: 1.3 }]
    fog: [{ op: multiply, value: 1.4 }]
    thunderstorm: [{ op: multiply, value: 1.1 }]
    snow: [{ op: multiply, value: 1.5 }]
  explore_100m_passively_xp: {}
  discover_site_xp: *field_survey_weather_type_xp
  discover_site_as_first_xp: {}
  document_progress_xp: *field_survey_weather_type_xp
  document_site_xp: *field_survey_weather_type_xp

# Flutter auto-discover + nearby-discoverable cache.
client:
  auto_discover_radius_m: 20.0
  cache_radius_km: 1.0
  cache_refresh_move_threshold_m: 500.0
  discover_fail_retry_s: 20
  # Re-roll while staying inside auto_discover_radius_m (not a main_param).
  # Walk-in still rolls immediately; app-open already inside does not (timer starts).
  discovery_reroll_interval_s: 10

# Fixed global distribution tables (not subject to level/tool multipliers).
dino_count:
  - max_odd: 0.10
    count: 0
  - max_odd: 0.60
    count: 1
  - max_odd: 0.80
    count: 2
  - max_odd: 0.90
    count: 3
  - max_odd: 0.95
    count: 4
  - max_odd: 1.00
    count: 5

# How many fossil cards per sampled dinosaur (CDF masses; inverse-CDF via odd_fossil_count).
fossil_count:
  1: 0.25
  2: 0.25
  3: 0.20
  4: 0.15
  5: 0.10
  6: 0.05

# Burial depth buckets (weights = CDF masses via odd_depth). Sample uniform in [min_cm, max_cm].
depth_weights:
  - weight: 0.10
    min_cm: 0
    max_cm: 0
  - weight: 0.30
    min_cm: 1
    max_cm: 50
  - weight: 0.30
    min_cm: 51
    max_cm: 200
  - weight: 0.20
    min_cm: 201
    max_cm: 500
  - weight: 0.10
    min_cm: 501
    max_cm: 1000

# Completeness tiers worst→best (CDF masses via odd_completeness). Replaces archive CDFs.
completeness_weights:
  trace_only: 0.05
  isolated_element: 0.20
  fragmentary: 0.30
  partial: 0.25
  substantial: 0.15
  nearly_complete: 0.05

# Preservation quality tiers worst→best (CDF masses via odd_quality). Replaces archive CDFs.
quality_weights:
  very_poor: 0.05
  poor: 0.15
  moderate: 0.35
  good: 0.25
  excellent: 0.15
  exceptional: 0.05

# Accuracy: +0.01 per level (1..99).
odd_noise:
  dino_count: 0
  fossil_count: 0.5
  completeness: 0.3
  quality: 0.3
  depth: 0.3

# Per-axis jitter around skill baseline accuracy on the site card (not a main_param;
# not level/tool resolvable). max_delta = ± absolute accuracy points (e.g. 0.30 → ±30%).
accuracy_noise:
  max_delta: 0.30

# Fallback attributes when distributions are empty.
defaults:
  subcategory: teeth
  completeness: fragmentary
  quality: moderate
