  visibility_distance_m: &field_survey_weather_time
    day: [{ op: multiply, value: 1.1 }]
    golden_hour: [{ op: multiply, value: 1.3 }]
    dawn: []
    dusk: []
    night: [{ op: multiply, value: 0.6 }]
  discovery_chance: *field_survey_weather_time
  max_discovery_speed_kmh: {}
  # XP: day +0%, golden_hour +10%, dawn/dusk +20%, night +50%.
  site_discovery_xp:
    day: []
    golden_hour: [{ op: multiply, value: 1.1 }]
    dawn: [{ op: multiply, value: 1.2 }]
    dusk: [{ op: multiply, value: 1.2 }]
    night: [{ op: multiply, value: 1.5 }]
  first_discovery_xp: {}
  active_100m_xp: {}
  passive_km_xp: {}
