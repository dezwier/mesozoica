# Skill 1 — Field Survey
# Site discovery, stewardship, and clearing (merged).

skill_id: field_survey

main_params:
  # --- discovery ---
  # Server enforces this on POST /sites/{id}/discover (and set-status).
  visibility_distance_m: 20.0
  # P(success) per discover attempt (walk-in enter or dwell re-roll).
  discovery_chance: 0.1
  # Max GPS speed for walk XP credit and walk-in / dwell discovery rolls.
  max_discovery_speed_kmh: 10.0
  # XP awarded when a site is discovered.
  site_discovery_xp: 20
  # Bonus XP when you are the first user to discover a site (others still get
  # site_discovery_xp later, but not this reward).
  first_discovery_xp: 20
  # XP per whole 100 m of active walking.
  active_100m_xp: 20
  # XP per whole passive kilometer (Health credits; awarded on cold restart).
  passive_km_xp: 100
  # --- stewardship ---
  # Card display estimation for each odd_* axis (0 = full-axis blur/jitter, 1 = exact).
  # Base 1%; level multiplies by skill level (L50 → 50%). Display-only for now.
  dino_accuracy: 0.01
  fossil_accuracy: 0.01
  completeness_accuracy: 0.01
  quality_accuracy: 0.01
  depth_accuracy: 0.01
  # Multiplier on discovery_chance for other users on sites where you have any
  # status above hidden (discovered, documented, excavated, …).
  # Level multiplies ×1.0 → ×0.5 from L1 → L99; tools multiply further on a covered site.
  rival_discovery: 1
  # Radius around a discovered site where walking accrues exploration meters.
  site_visibility_m: 50.0
  # XP when a rival discovery roll would have hit but your disguise blocked it
  # (Brush Scrim / Blackout Cover). Scrim still rolls; effective odds are 0.
  successful_site_disguise_xp: 40
  # XP to field_survey per 20 m walked inside site_visibility_m.
  site_exploration_xp: 20
  # XP when all five site-dimension accuracies reach 100% (documentation complete).
  site_documentation_xp: 80
  # Bonus XP when you are the first user to fully document a site (all dimensions
  # at 100% accuracy). Later documenters still get site_documentation_xp only.
  first_documentation_xp: 20
  # XP per identification quiz step (period, then rock type). Scaled by attempt:
  # first try 100%, second 50%, third 0%. Exploration meters start after both.
  site_identification_xp: 40

# Identity for v1 — tune later. Each list entry: { level, op: add|multiply|replace, value }.
level_modifiers:
  visibility_distance_m: []
  discovery_chance: []
  max_discovery_speed_kmh: []
  site_discovery_xp: []
  first_discovery_xp: []
  active_100m_xp: []
  passive_km_xp: []
  successful_site_disguise_xp: []
  site_visibility_m: []
  site_exploration_xp: []
  site_documentation_xp: []
  first_documentation_xp: []
