# Field fossils spawned when a site is discovered (once per site, global).
#
# Each field site has five odd_* scores Uniform(0,1). On survey, attributes use
# score = clamp(odd + Uniform(-noise, +noise), 0, 1) then pick a tier.
# See README.md in this directory for the full mechanics.

# Per-sampler ±noise applied to each odd_* score before tier lookup.
odd_noise:
  dino_count: 0
  fossil_count: 0.5
  completeness: 0.3
  quality: 0.3
  depth: 0.3

# How many distinct dinosaurs to sample for the site (from clamp(odd_dino_count)).
dino_count_thresholds:
  - max_odd: 0.10
    count: 0
  - max_odd: 0.60
    count: 1
  - max_odd: 0.80
    count: 2
  - max_odd: 0.90
    count: 3
  - max_odd: 0.95
    count: 4
  - max_odd: 1.00
    count: 5

# How many fossil cards per sampled dinosaur (CDF masses; inverse-CDF via odd_fossil_count).
card_count_weights:
  1: 0.25
  2: 0.25
  3: 0.20
  4: 0.15
  5: 0.10
  6: 0.05

# Burial depth buckets (weights = CDF masses via odd_depth). Sample uniform in [min_cm, max_cm].
depth_buckets:
  - weight: 0.10
    min_cm: 0
    max_cm: 0
  - weight: 0.30
    min_cm: 1
    max_cm: 50
  - weight: 0.30
    min_cm: 51
    max_cm: 200
  - weight: 0.20
    min_cm: 201
    max_cm: 500
  - weight: 0.10
    min_cm: 501
    max_cm: 1000

# Fallback attributes when archive distributions are empty.
defaults:
  subcategory: teeth
  completeness: fragmentary
  quality: moderate
