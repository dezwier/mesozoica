# Field fossils spawned when a site is discovered (once per site, global).

# How many distinct dinosaurs to sample for the site.
dino_count_weights:
  1: 0.60
  2: 0.30
  3: 0.10

# How many fossil cards per sampled dinosaur.
card_count_weights:
  1: 0.25
  2: 0.25
  3: 0.20
  4: 0.15
  5: 0.10
  6: 0.05

# Burial depth buckets (weights must sum to 1.0). Sample uniform in [min_cm, max_cm].
depth_buckets:
  - weight: 0.20
    min_cm: 0
    max_cm: 0
  - weight: 0.30
    min_cm: 1
    max_cm: 50
  - weight: 0.30
    min_cm: 51
    max_cm: 200
  - weight: 0.10
    min_cm: 201
    max_cm: 500
  - weight: 0.10
    min_cm: 501
    max_cm: 1000

# Fallback attributes when archive distributions are empty.
defaults:
  subcategory: teeth
  completeness: fragmentary
  quality: moderate
