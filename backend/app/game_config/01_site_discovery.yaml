# Skill 1 — Site Discovery
# Proximity rules for discovering a field site.

skill_id: site_discovery

main_params:
  # Server enforces this on POST /sites/{id}/discover (and set-status).
  visibility_distance_m: 20.0
  # P(success) per discover attempt (walk-in enter or dwell re-roll).
  discovery_chance: 0.1
  # Max GPS speed for walk XP credit and walk-in / dwell discovery rolls.
  max_discovery_speed_kmh: 10.0
  # XP awarded when a site is discovered.
  site_discovery_xp: 20
  # Bonus XP when you are the first user to discover a site (others still get
  # site_discovery_xp later, but not this reward).
  first_discovery_xp: 20
  # XP per whole active kilometer walked.
  active_km_xp: 30
  # XP per whole passive kilometer walked.
  passive_km_xp: 5

# Identity for v1 — tune later. Each list entry: { level, op: add|multiply|replace, value }.
level_modifiers:
  visibility_distance_m: []
  discovery_chance: []
  max_discovery_speed_kmh: []
  site_discovery_xp: []
  first_discovery_xp: []
  active_km_xp: []
  passive_km_xp: []

# Ambient solar period (dawn|day|dusk|night). After level, before weather_type + tools.
weather_time_modifiers:
  visibility_distance_m: &site_discovery_weather_time
    day: [{ op: multiply, value: 1.1 }]
    dawn: []
    dusk: []
    night: [{ op: multiply, value: 0.6 }]
  discovery_chance: *site_discovery_weather_time
  max_discovery_speed_kmh: {}
  # XP: day +0%, dawn/dusk +20%, night +50%.
  site_discovery_xp: &site_discovery_xp_weather_time
    day: []
    dawn: [{ op: multiply, value: 1.2 }]
    dusk: [{ op: multiply, value: 1.2 }]
    night: [{ op: multiply, value: 1.5 }]
  first_discovery_xp: *site_discovery_xp_weather_time
  active_km_xp: *site_discovery_xp_weather_time
  passive_km_xp: *site_discovery_xp_weather_time

# Ambient weather type (clear|cloudy|…). After weather_time, before tools.
weather_type_modifiers:
  visibility_distance_m: &site_discovery_weather_type
    clear: [{ op: multiply, value: 1.1 }]
    cloudy: [{ op: multiply, value: 1.05 }]
    overcast: []
    drizzle: [{ op: multiply, value: 0.95 }]
    rain: [{ op: multiply, value: 0.9 }]
    hail: [{ op: multiply, value: 0.9 }]
    fog: [{ op: multiply, value: 0.85 }]
    thunderstorm: [{ op: multiply, value: 0.8 }]
    snow: []
  discovery_chance: *site_discovery_weather_type
  max_discovery_speed_kmh: {}
  site_discovery_xp: {}
  first_discovery_xp: {}
  active_km_xp: {}
  passive_km_xp: {}

# Flutter auto-discover + nearby-discoverable cache.
client:
  auto_discover_radius_m: 20.0
  cache_radius_km: 1.0
  cache_refresh_move_threshold_m: 500.0
  discover_fail_retry_s: 20
  # Re-roll while staying inside auto_discover_radius_m (not a main_param).
  # Walk-in still rolls immediately; app-open already inside does not (timer starts).
  discovery_reroll_interval_s: 10
