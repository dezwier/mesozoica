[project]
name = "mesozoica-ai"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
    "pydantic",
    "requests",
    "langchain-text-splitters",
    "openai",
    "python-dotenv",
    "azure-search-documents",
    "pydantic-settings",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]