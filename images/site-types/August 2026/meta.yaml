prompt: |
  Generate a 3:4 portrait landscape photograph of a spectacular natural geological
  outcrop where fossils could be found — the kind of place that stops you mid-hike.
  Real geology and landscape, NOT cartoon, NOT CGI, NOT fantasy. Documentary iPhone
  photo with slight 'dramatic warm' tone, but compose it like a National Geographic
  landscape: bold, beautiful, and memorable — never a flat pile of dull rock and dirt.

  Visual ambition (critical — do not make a boring rock close-up):
  - Prioritize a dramatic WIDE VIEW with scale and depth: towering cliffs, deep
    canyons, sweeping badlands, stacked buttes, a river gorge, coastal headland,
    or escarpment dropping away into distance
  - Frame for beauty: leading lines in the strata, strong silhouette of the ridgeline,
    layered midground/background landforms, and a sky that adds mood (storm light,
    golden hour, low sun raking across the face, soft haze in the distance)
  - The outcrop should feel monumental — human-scale sense of height and space even
    with no people present
  - Color and light should be rich but natural: warm raking light on rock faces,
    cool shadows in recesses, atmospheric perspective — not grey, flat, or muddy

  Primary subject — rock type (must still be clear):
  - show {rock_type} clearly as the dominant exposed lithology: bedding, texture,
    color, and weathering typical of this rock type in the field
  - the drama comes from how that rock is exposed at landscape scale, not from
    inventing false geology
  - include authentic detail up close in the foreground (talus, fracture, lichen)
    while the hero of the frame remains the grand landform

  Period timing and flora (essential — fills the scene with life and era):
  - {period_context}
  - Period-appropriate vegetation must be clearly visible and contribute to the
    beauty of the scene: silhouettes on the skyline, green or russet pockets in
    draws, plants clinging to ledges, ferns in damp clefts — never a barren grey
    quarry unless the period truly demands sparse cover
  - Flora must fit the geological period (no modern lawns, crops, turf grass, or
    temperate park trees)

  Stay truthful:
  - Real weathered rock, irregular erosion, dust, and natural clutter — not CGI
    polish, not fantasy floating rocks, not alien planets
  - No hyper-saturation, no painterly stylization, no tourism-poster compositing

  Hard constraints:
  - no text, labels, signs, maps, or watermarks
  - no people, vehicles, tools, tarps, tents, or excavation equipment
  - no borders, frames, or graphic overlays
  - only nature: rock, sediment, sky, water if natural, and period-appropriate flora
  - no dinosaurs or animals as the subject (optional tiny distant birds at most)

  Avoid: boring ground-level rubble piles, tight featureless rock walls, museum
  slabs, studio backdrops, stock-photo perfection, manicured scenery, anachronistic
  plants, flat overcast grey mudscapes with nothing interesting in the distance.
