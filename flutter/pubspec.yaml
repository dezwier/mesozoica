name: mesozoica
description: "Mesozoica — location-based paleontology game."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  http: ^1.2.2
  cached_network_image: ^3.4.1
  flutter_widget_from_html: ^0.16.0
  fwfh_cached_network_image: ^0.16.0
  url_launcher: ^6.3.1
  flutter_svg: ^2.0.17
  flutter_map: ^6.1.0
  latlong2: ^0.9.1
  geolocator: ^13.0.1
  flutter_compass: ^0.8.0
  health: ^13.1.1
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.3
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  image_picker: ^1.1.2
  crypto: ^3.0.6
  flutter_map_animations: ^0.6.0
  flutter_map_cache: ^1.5.2
  path_provider: ^2.1.6
  dio_cache_interceptor_file_store: ^1.2.2
  firebase_messaging: ^15.2.10
  permission_handler: ^12.0.3
  mapbox_maps_flutter: ^2.26.0
  yaml: ^3.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/logo.png
  min_sdk_android: 21
  web:
    generate: true
    image_path: assets/images/logo.png
    background_color: '#ffffff'
    theme_color: '#ffffff'
  macos:
    generate: true
    image_path: assets/images/logo.png
  windows:
    generate: true
    image_path: assets/images/logo.png

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/images/cards/
    - assets/images/cards/icons/
    - assets/game_config/site_generation.yaml
    - assets/game_config/site_discovery.yaml
    - assets/game_config/fossil_generation.yaml
    - assets/game_config/fossil_discovery.yaml
    - assets/game_config/fossil_excavation.yaml
    - assets/game_config/tool_actions.yaml
    - assets/game_config/leveling.yaml
  fonts:
    - family: tt_ramilas
      fonts:
        - asset: assets/fonts/tt_ramillas/TT Ramillas Trial Regular.ttf
        - asset: assets/fonts/tt_ramillas/TT Ramillas Trial Medium.ttf
          weight: 500
        - asset: assets/fonts/tt_ramillas/TT Ramillas Trial Bold.ttf
          weight: 700
        - asset: assets/fonts/tt_ramillas/TT Ramillas Trial Italic.ttf
          style: italic
