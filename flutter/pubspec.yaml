name: mesozoica
description: "Mesozoica — location-based paleontology game."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  http: ^1.2.2
  cached_network_image: ^3.4.1
  flutter_widget_from_html: ^0.16.0
  fwfh_cached_network_image: ^0.16.0
  url_launcher: ^6.3.1
  flutter_svg: ^2.0.17
  flutter_map: ^6.1.0
  flutter_map_cancellable_tile_provider: ^2.0.0
  latlong2: ^0.9.1
  geolocator: ^13.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/logo.png
  min_sdk_android: 21
  web:
    generate: true
    image_path: assets/images/logo.png
    background_color: '#ffffff'
    theme_color: '#ffffff'
  macos:
    generate: true
    image_path: assets/images/logo.png
  windows:
    generate: true
    image_path: assets/images/logo.png

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/images/cards/
    - assets/images/cards/icons/
  fonts:
    - family: tt_ramilas
      fonts:
        - asset: assets/fonts/tt_ramillas/TT Ramillas Trial Regular.ttf
        - asset: assets/fonts/tt_ramillas/TT Ramillas Trial Medium.ttf
          weight: 500
        - asset: assets/fonts/tt_ramillas/TT Ramillas Trial Bold.ttf
          weight: 700
        - asset: assets/fonts/tt_ramillas/TT Ramillas Trial Italic.ttf
          style: italic
